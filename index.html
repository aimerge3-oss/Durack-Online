<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Дурак Онлайн</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="screen">
      <div class="loader"></div>
      <p>Загрузка...</p>
    </div>

    <div id="menu" class="screen hidden">
      <div class="top-bar">
        <div class="user-info">
          <img id="user-avatar" src="" alt="" class="avatar" />
          <span id="user-name">Игрок</span>
        </div>
        <div class="top-right">
          <div class="coins">
            <span id="user-coins">0</span>
            <span class="coin-icon">🪙</span>
          </div>
          <div class="online-badge" id="online-badge" title="Сейчас в сети">
            <span class="online-dot"></span>
            <span id="online-count">0</span>
            <span class="online-label">онлайн</span>
          </div>
        </div>
      </div>

      <div class="menu-buttons">
        <div class="player-count-row">
          <span>Игроков</span>
          <div class="player-count-btns" id="player-count-btns">
            <button type="button" data-count="2" class="active">2</button>
            <button type="button" data-count="3">3</button>
            <button type="button" data-count="4">4</button>
          </div>
        </div>
        <button class="btn primary" id="btn-quick">Быстрая игра</button>
        <button class="btn" id="btn-vs-bot">Игра с ботами</button>
        <button class="btn" id="btn-online">Онлайн (поиск)</button>
        <button class="btn" id="btn-friends">Друзья / Комната</button>
        <button class="btn" id="btn-referral">Пригласить (+500)</button>
        <button class="btn" id="btn-leaderboard">Доска почёта</button>
        <button class="btn" id="btn-shop">Магазин</button>
        <button class="btn" id="btn-tournament">Турниры</button>
        <button class="btn" id="btn-settings">Настройки</button>
      </div>
      <div class="footer"><p class="version">Durack Online v0.3.0</p></div>
    </div>

    <div id="leaderboard" class="screen hidden">
      <div class="header">
        <button class="btn-back" id="btn-back-lb">← Назад</button>
        <h2>Доска почёта</h2>
      </div>
      <div id="lb-list" class="list"></div>
    </div>

    <div id="shop" class="screen hidden">
      <div class="header">
        <button class="btn-back" id="btn-back-shop">← Назад</button>
        <h2>Магазин</h2>
      </div>
      <p class="screen-sub">Стикеры за монеты · у вас: <b id="shop-coins">0</b> 🪙</p>
      <div id="shop-list" class="shop-grid"></div>
    </div>

    <div id="friends" class="screen hidden">
      <div class="header">
        <button class="btn-back" id="btn-back-friends">← Назад</button>
        <h2>Комната</h2>
      </div>
      <p class="screen-sub">Создай комнату или войди по коду</p>
      <div class="friends-box">
        <button class="btn primary" id="btn-create-room">Создать комнату</button>
        <div class="room-code-row hidden" id="room-created-row">
          <span>Код:</span>
          <b id="room-code-display">----</b>
          <button class="btn btn-sm" id="btn-copy-room">Копировать</button>
          <button class="btn btn-sm primary" id="btn-share-room">Поделиться</button>
          <button class="btn primary" id="btn-enter-created">Войти в игру</button>
        </div>
        <div class="divider">или</div>
        <input class="input" id="room-code-input" placeholder="Код комнаты" maxlength="8" />
        <button class="btn" id="btn-join-room">Войти по коду</button>
      </div>
    </div>

    <div id="referral" class="screen hidden">
      <div class="header">
        <button class="btn-back" id="btn-back-ref">← Назад</button>
        <h2>Рефералка</h2>
      </div>
      <div class="ref-card">
        <div class="ref-bonus">+500 🪙</div>
        <p>За каждого друга, который откроет игру по твоей ссылке</p>
        <div class="ref-link-box" id="ref-link-text">...</div>
        <button class="btn primary" id="btn-share-ref">Поделиться в Telegram</button>
        <button class="btn" id="btn-copy-ref">Скопировать ссылку</button>
      </div>
    </div>

    <div id="game" class="screen hidden">
      <div class="game-top">
        <button class="btn-back" id="btn-leave">Выйти</button>
        <div class="timer-wrap"><span id="timer">15</span></div>
        <div class="deck-info" id="deck-info">
          <div class="trump-label">
            <span class="trump-label-text">Козырь</span>
            <span class="trump-suit-big" id="trump-suit-big">♠</span>
          </div>
          <div class="trump-pile" id="trump-pile">
            <div class="trump-card-face" id="trump-card-face"></div>
            <div class="deck-stack" id="deck-stack"></div>
            <span class="deck-count-badge" id="deck-count">24</span>
          </div>
        </div>
      </div>
      <div class="opponents" id="opponents"></div>
      <div class="table-area">
        <div class="table-cards" id="table-cards"></div>
        <p class="table-hint" id="table-hint">Ожидание хода...</p>
      </div>
      <div class="hand-area"><div class="hand" id="player-hand"></div></div>
      <div class="actions" id="actions">
        <button class="btn action-btn" id="btn-take">Беру</button>
        <button class="btn action-btn primary" id="btn-done">Бито</button>
        <button class="btn action-btn" id="btn-pass">Пас</button>
      </div>
    </div>
  </div>
  <script src="durak.js"></script>
  <script src="app.js"></script>
  <script src="presence.js"></script>
  <script src="stage2.js"></script>
</body>
</html>
