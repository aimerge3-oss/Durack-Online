<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Дурак Онлайн</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="screen">
      <div class="loader"></div>
      <p>Загрузка...</p>
    </div>

    <div id="menu" class="screen hidden">
      <div class="top-bar">
        <div class="user-info">
          <img id="user-avatar" src="" alt="" class="avatar" />
          <span id="user-name">Игрок</span>
        </div>
        <div class="coins">
          <span id="user-coins">0</span>
          <span class="coin-icon">🪙</span>
        </div>
      </div>

      <div class="menu-buttons">
        <div class="player-count-row">
          <span>Игроков</span>
          <div class="player-count-btns" id="player-count-btns">
            <button type="button" data-count="2" class="active">2</button>
            <button type="button" data-count="3">3</button>
            <button type="button" data-count="4">4</button>
          </div>
        </div>
        <button class="btn primary" id="btn-quick">Быстрая игра</button>
        <button class="btn" id="btn-vs-bot">Игра с ботами</button>
        <button class="btn" id="btn-online">Онлайн (поиск)</button>
        <button class="btn" id="btn-tournament">Турниры</button>
        <button class="btn" id="btn-friends">Друзья</button>
        <button class="btn" id="btn-leaderboard">Доска почёта</button>
        <button class="btn" id="btn-shop">Предметы</button>
        <button class="btn" id="btn-settings">Настройки</button>
      </div>
      <div class="footer"><p class="version">Durack Online v0.1.1</p></div>
    </div>

    <div id="leaderboard" class="screen hidden">
      <div class="header">
        <button class="btn-back" id="btn-back-lb">← Назад</button>
        <h2>Доска почёта</h2>
      </div>
      <div id="lb-list" class="list"></div>
    </div>

    <div id="game" class="screen hidden">
      <div class="game-top">
        <button class="btn-back" id="btn-leave">Выйти</button>
        <div class="timer-wrap"><span id="timer">15</span></div>
        <div class="deck-info" id="deck-info" title="Колода / козырь">
          <div class="trump-pile" id="trump-pile">
            <div class="trump-card-face" id="trump-card-face"></div>
            <div class="deck-stack" id="deck-stack"></div>
            <span class="deck-count-badge" id="deck-count">24</span>
          </div>
        </div>
      </div>
      <div class="opponents" id="opponents"></div>
      <div class="table-area">
        <div class="table-cards" id="table-cards"></div>
        <p class="table-hint" id="table-hint">Ожидание хода...</p>
      </div>
      <div class="hand-area"><div class="hand" id="player-hand"></div></div>
      <div class="actions" id="actions">
        <button class="btn action-btn" id="btn-take">Беру</button>
        <button class="btn action-btn primary" id="btn-done">Бито</button>
        <button class="btn action-btn" id="btn-pass">Пас</button>
      </div>
    </div>
  </div>
  <script src="durak.js"></script>
  <script src="app.js"></script>
</body>
</html>
